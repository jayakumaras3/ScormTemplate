<section class="page" *ngIf="page">
  @if (contentType === 'captivate' || contentType === 'iframe') {
    <div class="media-frame">
      <iframe
        [src]="safeResourceUrl"
        title="Course content"
        scrolling="no"
      ></iframe>
    </div>
  } @else if (contentType === 'video') {
    <div class="media-frame">
      <video controls [src]="resolvedContentPath"></video>
    </div>
  } @else {
    <div class="fallback">
      <p>Content type is not directly renderable.</p>
      <a [href]="resolvedContentPath" target="_blank" rel="noopener noreferrer">Open content</a>
    </div>
  }
</section>
