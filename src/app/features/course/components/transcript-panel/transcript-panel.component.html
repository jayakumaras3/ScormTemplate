@if (visible) {
  <div class="overlay" role="dialog" aria-modal="true" (click)="close.emit()">
    <div class="panel" (click)="$event.stopPropagation()">
      <header>
        <h2>{{ transcriptTitle }}</h2>
        <button type="button" class="close-btn" (click)="close.emit()" aria-label="Close">✕</button>
      </header>

      @if (transcriptContent) {
        <div class="content" [innerHTML]="transcriptContent"></div>
      } @else {
        <p class="empty">No transcript available for this page.</p>
      }
    </div>
  </div>
}
