@if (visible) {
  <section class="panel">
    <header>
      <h3>Transcript</h3>
      <button type="button" (click)="close.emit()">Close</button>
    </header>

    @if (entries.length) {
      <ul>
        @for (entry of entries; track entry.pageId) {
          <li>
            <h4>
              {{ entry.title }}
              @if (entry.completed) {
                <span class="status">Completed</span>
              }
            </h4>
            <div [innerHTML]="entry.transcript"></div>
          </li>
        }
      </ul>
    } @else {
      <p>No visited pages yet.</p>
    }
  </section>
}
