@if (vm$ | async; as vm) {
  @if (vm.loading) {
    <app-loading-spinner />
  } @else if (vm.error) {
    <section class="error-state">
      <h2>Unable to load course</h2>
      <p>{{ vm.error }}</p>
    </section>
  } @else {
    <section class="app-container" [class.menu-open]="vm.menuOpen">
      <header class="app-header top-bar">
        <div class="top-left">
          <button class="icon-btn" type="button" (click)="toggleMenu()">☰</button>
          <h1 class="crumb">{{ vm.currentPageTitle }}</h1>
        </div>
      </header>

      <div class="app-body">
        <div class="menu-backdrop" [class.open]="vm.menuOpen" (click)="closeMenu()"></div>

        <aside class="side-menu" [class.open]="vm.menuOpen" [attr.aria-hidden]="!vm.menuOpen">
          <app-sidebar-menu
            [pages]="vm.pages"
            [currentPageIndex]="vm.currentPageIndex"
            [visitedPageIds]="vm.visitedPageIds"
            [menuTitle]="vm.menuTitle"
            (pageSelected)="selectMenuPage($event)"
            (closeMenu)="closeMenu()"
          />
        </aside>

        <main class="app-content">
          <app-page-view [page]="vm.page" />
        </main>
      </div>

      <footer class="app-footer">
        <app-navigation-bar
          [canGoBack]="vm.canGoBack"
          [canGoNext]="vm.canAdvance"
          [completionPercentage]="vm.completion"
          [currentPage]="vm.currentPageIndex + 1"
          [totalPages]="vm.pages.length"
          [nextLabel]="vm.nextLabel"
          [prevLabel]="vm.prevLabel"
          [transcriptLabel]="vm.transcriptLabel"
          (previous)="goBack()"
          (next)="goNext()"
          (openMenu)="toggleMenu()"
          (openTranscript)="toggleTranscript()"
          (toggleAudio)="toggleAudio()"
        />
      </footer>

      <app-transcript-panel
        [visible]="vm.transcriptOpen"
        [transcriptContent]="vm.currentTranscript"
        [transcriptTitle]="vm.transcriptTitle"
        (close)="toggleTranscript()"
      />

      <app-resume-dialog
        [visible]="vm.showResumeDialog"
        [resumeTitle]="vm.resumeTitle"
        [resumeMessage]="vm.resumeMessage"
        [resumeButtonLabel]="vm.resumeYesLabel"
        [restartButtonLabel]="vm.resumeNoLabel"
        (resume)="resumeCourse()"
        (restart)="restartCourse()"
      />
    </section>
  }
}
