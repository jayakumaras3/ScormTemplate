<section class="menu-drawer">
  <div class="drawer-logo">
    <img src="assets/logo.svg" alt="Logo" class="logo-img" />
  </div>

  <header class="drawer-header">
    <h2>{{ menuTitle }}</h2>
    <button type="button" class="close-btn" (click)="closeMenu.emit()">✕</button>
  </header>

  <div class="drawer-list">
    <ul>
      @for (entry of pages; track entry.name; let i = $index) {
        <li>
          <button
            type="button"
            [ngClass]="{ active: i === currentPageIndex, visited: isVisited(entry.name) }"
            (click)="pageSelected.emit(i)"
          >
            {{ entry.title }}
          </button>
        </li>
      }
    </ul>
  </div>
</section>
