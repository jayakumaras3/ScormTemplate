@if (visible) {
  <div class="resume-overlay" role="dialog" aria-modal="true">
    <div class="resume-dialog">
      <h2>{{ resumeTitle }}</h2>
      <p>{{ resumeMessage }}</p>
      <div class="dialog-actions">
        <button type="button" (click)="resumeCourse()">{{ resumeButtonLabel }}</button>
        <button type="button" class="ghost" (click)="restartCourse()">{{ restartButtonLabel }}</button>
      </div>
    </div>
  </div>
}
